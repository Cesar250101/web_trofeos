<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#f4f4f4"/>
  <!-- Laser machine illustration -->
  <rect x="100" y="80" width="400" height="200" rx="8" fill="#1a2332" opacity="0.9"/>
  <rect x="120" y="100" width="360" height="160" rx="4" fill="#0d1117"/>
  <!-- Laser head -->
  <rect x="260" y="90" width="80" height="60" rx="4" fill="#c9a227" opacity="0.8"/>
  <circle cx="300" cy="130" r="12" fill="#e8c84a"/>
  <!-- Beam -->
  <line x1="300" y1="150" x2="300" y2="240" stroke="#c9a227" stroke-width="3" opacity="0.7"/>
  <ellipse cx="300" cy="240" rx="8" ry="3" fill="#c9a227" opacity="0.5"/>
  <!-- Work surface -->
  <rect x="140" y="240" width="320" height="40" rx="2" fill="#2c2c2c"/>
  <!-- Material being engraved -->
  <rect x="180" y="248" width="240" height="24" rx="1" fill="#c9a227" opacity="0.15"/>
  <text x="300" y="265" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#c9a227" text-anchor="middle" letter-spacing="2">GRABADO LÁSER</text>
  <!-- Base -->
  <rect x="80" y="280" width="440" height="20" rx="4" fill="#2c2c2c"/>
  <!-- Label below -->
  <text x="300" y="380" font-family="'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#0d1117" text-anchor="middle">Precisión milimétrica</text>
  <text x="300" y="405" font-family="'Montserrat', sans-serif" font-size="12" fill="#5a5a5a" text-anchor="middle">en acero, aluminio, madera y acrílico</text>
</svg>
