<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#1a2332"/>
  <!-- Office/corporate illustration -->
  <!-- Building -->
  <rect x="80" y="180" width="180" height="240" rx="2" fill="#0d1117" stroke="#c9a227" stroke-width="1" opacity="0.8"/>
  <!-- Windows -->
  <g fill="#c9a227" opacity="0.3">
    <rect x="100" y="200" width="30" height="20"/>
    <rect x="145" y="200" width="30" height="20"/>
    <rect x="190" y="200" width="30" height="20"/>
    <rect x="100" y="235" width="30" height="20"/>
    <rect x="145" y="235" width="30" height="20"/>
    <rect x="190" y="235" width="30" height="20"/>
    <rect x="100" y="270" width="30" height="20"/>
    <rect x="145" y="270" width="30" height="20"/>
    <rect x="190" y="270" width="30" height="20"/>
  </g>
  <!-- Door -->
  <rect x="150" y="360" width="40" height="60" rx="1" fill="#c9a227" opacity="0.5"/>
  <!-- Trophy awards on right -->
  <g transform="translate(350,140)">
    <!-- Trophy 1 -->
    <g transform="translate(0,0)" opacity="0.9">
      <path d="M40,0 C65,0 80,25 80,60 L80,85 L65,92 L65,110 L80,110 L80,125 L0,125 L0,110 L15,110 L15,92 L0,85 L0,60 C0,25 15,0 40,0 Z" fill="#c9a227"/>
      <path d="M0,35 C-20,25 -24,60 -8,68 L0,60" fill="none" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
      <path d="M80,35 C100,25 104,60 88,68 L80,60" fill="none" stroke="#c9a227" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- Trophy 2 smaller -->
    <g transform="translate(110,30)" opacity="0.7">
      <path d="M28,0 C46,0 58,18 58,43 L58,60 L46,66 L46,78 L58,78 L58,90 L0,90 L0,78 L12,78 L12,66 L0,60 L0,43 C0,18 12,0 28,0 Z" fill="#c9a227"/>
    </g>
    <!-- Stars -->
    <polygon points="40,-20 44,-8 56,-8 47,0 50,12 40,5 30,12 33,0 24,-8 36,-8" fill="#e8c84a" opacity="0.7"/>
    <polygon points="138,10 141,18 150,18 143,23 146,31 138,26 130,31 133,23 126,18 135,18" fill="#e8c84a" opacity="0.5"/>
  </g>
  <!-- Labels -->
  <text x="300" y="455" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#c9a227" text-anchor="middle" letter-spacing="2">SOLUCIONES CORPORATIVAS</text>
  <text x="300" y="478" font-family="'Montserrat', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Desde 50 unidades · Precios especiales</text>
</svg>
