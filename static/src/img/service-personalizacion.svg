<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#f4f4f4"/>
  <!-- Trophy with custom logo -->
  <g transform="translate(200,60)">
    <!-- Cup body -->
    <path d="M100,0 C160,0 200,60 200,140 L200,200 L160,220 L160,260 L200,260 L200,300 L0,300 L0,260 L40,260 L40,220 L0,200 L0,140 C0,60 40,0 100,0 Z" fill="#c9a227" opacity="0.9"/>
    <!-- Custom logo area on cup -->
    <rect x="40" y="60" width="120" height="80" rx="4" fill="rgba(13,17,23,0.2)"/>
    <text x="100" y="95" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#0d1117" text-anchor="middle" opacity="0.6">TU LOGO</text>
    <text x="100" y="112" font-family="'Montserrat', sans-serif" font-size="9" fill="#0d1117" text-anchor="middle" opacity="0.5">AQUÍ</text>
    <!-- Handles -->
    <path d="M0,80 C-50,60 -60,140 -20,160 L0,140" fill="none" stroke="#c9a227" stroke-width="18" stroke-linecap="round"/>
    <path d="M200,80 C250,60 260,140 220,160 L200,140" fill="none" stroke="#c9a227" stroke-width="18" stroke-linecap="round"/>
    <!-- Star -->
    <polygon points="100,-20 107,-6 122,-5 111,5 115,20 100,12 85,20 89,5 78,-5 93,-6" fill="#c9a227"/>
  </g>
  <!-- Color swatches -->
  <g transform="translate(80,390)">
    <rect x="0" y="0" width="36" height="36" fill="#0d1117"/>
    <rect x="44" y="0" width="36" height="36" fill="#c9a227"/>
    <rect x="88" y="0" width="36" height="36" fill="#e8c84a"/>
    <rect x="132" y="0" width="36" height="36" fill="#f4f4f4" stroke="#cccccc" stroke-width="1"/>
    <text x="220" y="24" font-family="'Montserrat', sans-serif" font-size="13" fill="#0d1117" font-weight="600">Colores corporativos exactos</text>
  </g>
</svg>
