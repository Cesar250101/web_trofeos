<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c84a"/>
      <stop offset="100%" stop-color="#a07d18"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg2)"/>
  <!-- Geometric pattern -->
  <circle cx="800" cy="450" r="420" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.1"/>
  <circle cx="800" cy="450" r="300" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.15"/>
  <circle cx="800" cy="450" r="180" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.2"/>
  <!-- Medal shape -->
  <g transform="translate(820,200)">
    <!-- Ribbon top -->
    <path d="M-40,0 L40,0 L60,80 L20,60 L0,80 L-20,60 L-60,80 Z" fill="#c9a227" opacity="0.85"/>
    <!-- Medal circle -->
    <circle cx="0" cy="170" r="140" fill="url(#gold2)"/>
    <circle cx="0" cy="170" r="118" fill="#1a2332"/>
    <circle cx="0" cy="170" r="110" fill="none" stroke="#c9a227" stroke-width="2"/>
    <!-- Star burst -->
    <polygon points="0,90 13,128 55,128 22,152 34,190 0,168 -34,190 -22,152 -55,128 -13,128" fill="#c9a227" opacity="0.9"/>
    <!-- "1" numeral -->
    <text x="0" y="195" font-family="'Montserrat', sans-serif" font-size="56" font-weight="900" fill="#e8c84a" text-anchor="middle">1</text>
  </g>
  <!-- Text -->
  <text x="180" y="720" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#c9a227" letter-spacing="6" opacity="0.7">MEDALLAS PARA CAMPEONES</text>
  <text x="180" y="620" font-family="'Montserrat', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">MEDALLAS</text>
  <text x="180" y="680" font-family="'Montserrat', sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.65)">de <tspan fill="#c9a227" font-weight="700">Alto Impacto</tspan></text>
</svg>
