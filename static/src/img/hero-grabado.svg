<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg3)"/>
  <!-- Laser beam effect lines -->
  <line x1="700" y1="200" x2="900" y2="480" stroke="#c9a227" stroke-width="2" opacity="0.6"/>
  <line x1="700" y1="200" x2="860" y2="490" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="200" x2="920" y2="470" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  <!-- Laser source circle -->
  <circle cx="700" cy="200" r="24" fill="#c9a227" opacity="0.9"/>
  <circle cx="700" cy="200" r="40" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.35"/>
  <circle cx="700" cy="200" r="60" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.15"/>
  <!-- Engraving surface (plaque) -->
  <rect x="780" y="410" width="300" height="200" rx="0" fill="#1a2332" stroke="#c9a227" stroke-width="2"/>
  <!-- Text being "engraved" on plaque -->
  <text x="930" y="490" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#c9a227" text-anchor="middle" letter-spacing="3">CAMPEÓN 2024</text>
  <line x1="820" y1="510" x2="1040" y2="510" stroke="#c9a227" stroke-width="1" opacity="0.5"/>
  <text x="930" y="540" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#c9a227" text-anchor="middle" letter-spacing="2" opacity="0.7">EMPRESA ABC · CHILE</text>
  <!-- Grid lines in background -->
  <g opacity="0.05" stroke="#c9a227" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="240" y1="0" x2="240" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="960" y1="0" x2="960" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>
  <!-- Text -->
  <text x="180" y="720" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#c9a227" letter-spacing="6" opacity="0.7">TECNOLOGÍA LÁSER DE PRECISIÓN</text>
  <text x="180" y="620" font-family="'Montserrat', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">GRABADO</text>
  <text x="180" y="680" font-family="'Montserrat', sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.65)"><tspan fill="#c9a227" font-weight="700">Personalizado</tspan></text>
</svg>
